version: 1
# Profiles de permissão por camada (policy executável).
# Camadas conhecidas: bff, api, mfe, gtw, worker, batch. Qualquer outra é fail-closed.
profiles:
  bff:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
    write_deny:
      - ".github/workflows/**"
      - "infra/prod/**"
      - "**/*.pem"
      - "**/*secret*"
    commands_allow:
      - executable: ./mvnw
        args: [test]
      - executable: ./mvnw
        args: [verify]
      - executable: git
        args: [diff]
      - executable: pytest
    commands_deny:
      - executable: terraform
        args: [apply]
      - executable: kubectl
        args: [delete]
  api:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
    write_deny:
      - "**/*.pem"
      - "**/*secret*"
    commands_allow:
      - executable: ./mvnw
        args: [test]
      - executable: pytest
    commands_deny:
      - executable: terraform
        args: [apply]
  mfe:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
    write_deny:
      - "**/*.pem"
      - "**/*secret*"
    commands_allow:
      - executable: npm
        args: [test]
      - executable: pnpm
        args: [test]
    commands_deny:
      - executable: terraform
        args: [apply]
  gtw:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
    write_deny:
      - ".github/workflows/**"
      - "infra/prod/**"
      - "**/*.pem"
      - "**/*secret*"
    commands_allow:
      - executable: ./mvnw
        args: [test]
      - executable: pytest
    commands_deny:
      - executable: terraform
        args: [apply]
      - executable: kubectl
        args: [delete]
  worker:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
    write_deny:
      - "**/*.pem"
      - "**/*secret*"
      - "infra/prod/**"
    commands_allow:
      - executable: ./mvnw
        args: [test]
      - executable: pytest
    commands_deny:
      - executable: terraform
        args: [apply]
  batch:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
    write_deny:
      - "**/*.pem"
      - "**/*secret*"
      - "infra/prod/**"
    commands_allow:
      - executable: ./mvnw
        args: [test]
      - executable: pytest
    commands_deny:
      - executable: terraform
        args: [apply]
