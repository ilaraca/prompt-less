version: 1
# Profiles de permissão por camada (policy executável).
# Camadas conhecidas: bff, api, mfe, gtw, worker, batch. Qualquer outra é fail-closed.
#
# limits.* são enforcement durante a execução (EnforcedRunner), não só auditoria.
# Sem capabilities ⊇ required_capabilities o despacho é bloqueado (DispatchBlocked).
profiles:
  bff:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
    write_deny:
      - ".github/workflows/**"
      - "infra/prod/**"
      - "**/*.pem"
      - "**/*secret*"
    commands_allow:
      - executable: ./mvnw
        args: [test]
      - executable: ./mvnw
        args: [verify]
      - executable: git
        args: [diff]
      - executable: pytest
    commands_deny:
      - executable: terraform
        args: [apply]
      - executable: kubectl
        args: [delete]
    limits:
      timeout_seconds: 3600
      max_processes: 32
      memory_mb: 2048
      network: deny
      credentials: scrub
      required_capabilities:
        - commands
        - writes
        - credentials
        - time
        - processes
        - network
        - resources
  api:
    write_allow:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
    write_deny:
