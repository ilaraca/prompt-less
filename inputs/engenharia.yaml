# Defaults de engenharia da plataforma (Prompt-less) — baseline v2.
# Histórias/PRD/SDD consomem NFRs selecionados por camada + criticidade.
# Schema: config/engenharia.schema.yaml (version 1 ainda migra na ingest).

version: 2
criticidade: medium

stack:
  bff:
    - Java 17
    - Spring Boot 3
  mfe:
    - TypeScript
    - React

padroes:
  - hexagonal
  - openapi-first
  - bff-for-frontend

arquitetura:
  fluxo: MFE -> BFF -> API Domínio
  contrato: openapi

resiliencia:
  timeout_ms: 2000
  retry:
    max_attempts: 2
    backoff: exponential
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    reset_timeout_ms: 30000
  idempotencia:
    enabled: true
    key_header: Idempotency-Key

observabilidade:
  logs:
    formato: structured_json
    campos_minimos:
      - timestamp
      - level
      - service
      - correlation_id
      - message
    sem_pii: true
  metrics:
    enabled: true
    padrao: red
    export: prometheus
  tracing:
    enabled: true
    padrao: w3c-tracecontext
    sampler: parentbased_traceidratio

seguranca:
  validar_input: true
  authn: required
  authz: required

documentacao:
  readme:
    obrigatorio: true
    secoes_minimas:
      - proposito
      - como-rodar-local
      - arquitetura
      - endpoints-ou-contratos
      - variaveis-de-ambiente
      - ownership
  changelog:
    obrigatorio: true
    formato: keep-a-changelog
    path: CHANGELOG.md
  api_docs:
    obrigatorio: true
    por_linguagem:
      java: javadoc
      kotlin: kdoc
      typescript: tsdoc
      javascript: jsdoc
      python: docstring
      go: godoc
      csharp: xml-doc
      rust: rustdoc
